# Lint: golangci-lint v2 with .golangci.yml, on the whole tree (NFR-12).
name: Lint
on:
  push:
    paths:
      - "**.go"
      - go.mod
      - .golangci.yml
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - .golangci.yml

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: go mod verify

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
