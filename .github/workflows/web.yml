# Web: the visualizer builds from a clean checkout. alGOrithm compiles to
# WebAssembly, and the site lints, type-checks, passes its tests against that
# real wasm, and builds its static export (NFR-21, NFR-25).
name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "**.go"
      - go.mod
      - web/runtime/go.mod
      - Makefile
      - .github/workflows/web.yml
  pull_request:
    paths:
      - "web/**"
      - "**.go"
      - go.mod
      - web/runtime/go.mod
      - Makefile
      - .github/workflows/web.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # One toolchain for both wasm builds, since the page runs them with one
      # wasm_exec.js; the terminal's module (web/runtime) needs the newer Go.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: web/runtime/go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The site loads this binary; it is built, not committed.
      - name: Build the wasm
        run: make web/wasm

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Type-check
        working-directory: web
        run: pnpm typecheck

      - name: Test against the real wasm
        working-directory: web
        run: pnpm test

      - name: Build the site
        working-directory: web
        run: pnpm build

      - name: Check the size budgets (docs/workflows/performance.md)
        working-directory: web
        run: pnpm budget

      - name: Keep the static site
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: web/out
          retention-days: 7
