# Tests: every package builds, is gofmt -s clean, passes go vet and its tests
# under the race detector on Linux, macOS and Windows; the wasm build compiles
# and the command runs (NFR-1, NFR-9, NFR-11, NFR-21).
name: Tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Format
        if: runner.os == 'Linux'
        run: make format/check

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build for the browser
        if: runner.os == 'Linux'
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/algorithm-wasm

      - name: Command smoke test
        if: runner.os == 'Linux'
        run: |
          go build -o bin/algorithm ./cmd/algorithm
          ./bin/algorithm list
          ./bin/algorithm run merge-sort 5 3 9 1
          ./bin/algorithm run round-robin --example
          ./bin/algorithm run a-star --generate maze
          ./bin/algorithm compare --generate random --size 500
